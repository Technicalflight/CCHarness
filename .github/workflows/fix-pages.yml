name: Fix Pages Config

# One-off: resets the stale custom-domain mapping (html_url stuck on
# technicalflight.icu while cname is null) by PUTting the Pages config
# with the workflow's own GITHUB_TOKEN (granted pages:write below).
# This workflow can be deleted once the site serves correctly.

on:
  push:
    paths: [".github/workflows/fix-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Show current Pages config
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }}/pages

      - name: PUT updated Pages config (clear stale domain mapping)
        run: |
          CODE=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "PUT status: $CODE"
          cat /tmp/put.json
          test "$CODE" = "200"

      - name: Verify config
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }}/pages
