name: CI

# Minimal quality gate: frontend typecheck+build and the Rust test suite on
# every push/PR, so type errors and test regressions can never ride a tag
# straight into a three-platform Release. Packaging lives in release.yml and
# the site in deploy-pages.yml — this workflow touches neither.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tauri-build validates that frontendDist (../dist) exists at compile
      # time — an empty placeholder satisfies it; real assets come from the
      # web job and the release workflow
      - run: mkdir -p dist
      - name: Install dependencies (Tauri Linux build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: cargo test --manifest-path src-tauri/Cargo.toml
