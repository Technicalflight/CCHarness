[package]
name = "ccharness"
version = "0.2.0"
description = "CCHarness — multi-model chat platform with prefix-cache telemetry"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Technicalflight/CCHarness"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking", "multipart", "gzip", "zstd"], default-features = false }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# privacy mode: PII detection patterns (keys / phones / emails / IDs / IPs)
regex = "1"
base64 = "0.22"
chrono = "0.4"
url = "2"
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# bundled SQLite for reading the cc-switch provider database (~/.cc-switch/cc-switch.db)
rusqlite = { version = "0.32", features = ["bundled"] }
# cross-platform API-key sealing: master key in the OS keyring
# (macOS Keychain / Linux Secret Service), AES-256-GCM for the inline blob
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
